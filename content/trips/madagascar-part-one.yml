itinerary:
  - title: Antananarivo
    text: Land, we pick you up from the airport, let you check-in, shower, relax a bit. Then we have our first meal and welcome drinks as a team.
  - title: Lake Tritiva & Antsirabe
    text: Morning drive, group lunch, then a loop of the beautiful Lake Tritiva. Join us tonight for drinks & a boogie in town.
  - title: The Highlands & Miandrivazo
    text: Say goodbye to roads and cities, we head west into the small-villaged highlands, where the desert meets the river. Afternoon of fun in the sun, in one of Madagascar's warmest areas.
  - title: Canoe Adventure on the Tsiribihina
    text: Our first day on the river takes us into the depths of Madagascar, where few get to roam. We pass rural villages, wild lemurs, refreshing with a waterfall swim before setting up camp under the stars.
  - title: Tsiribihina River
    text: Today, the landscape begins to change from highlands to jungle, and back to plains and small-village fishing with rice paddies. Our relaxing day takes us past one of the most remote areas of the country, before enjoying dinner, music, and dance by firelight.
  - title: Belo Sur Tsiribihina
    text: "We love an adventure, and today we pivot from canoe to 4x4, and onto Madagascar's most interesting self-made transport system: the floating barge boat. Our 4x4s cruise north to the plains, where roads and infrastructure cease to exist, yet the views remain exhilarating."
  - title: Tsingy de Bemaraha
    text: Today we hike and via ferrata our way through the UNESCO World Heritage National Park's most jagged landscapes. We traverse between caves, rocks that you could mistake for a moon landing, and dense forests with species of lemurs and birds found only in this park.
  - title: Kirindy National Park
    text: "Using our final barge boats, we head south into the best-preserved and best-researched national park in Madagascar: Kirindy. A night hike with an expert guide allows us to see the nocturnal lemurs in action & view the baobabs through a star-studded canopy."
  - title: Avenue of the Baobabs
    text: "After a morning walk waking up amongst the playful daytime lemurs, we climb atop our 4x4s, floating under the baobab branches and into one of the best-known sites in Madagascar: Avenue de Baobabs. The brave will taste the rum and fruit from the trees, and the team will enjoy a whole afternoon in the park before heading into Morondava for drinks and a night out."
  - title: Departure Day or Travel South for Part Two
    text: "For those finishing up in Madagascar, you may have a day on the coast at your leisure. For those continuing to the South: **Part Two Madagascar: Coast, Canyons, & Rainforest**, the group flies to Tulear, ending up in Ifaty for an afternoon on the stunning beaches & to meet their new team members."

