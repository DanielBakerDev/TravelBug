intro: |-
  The Grand Tour is not a third trip. It is Part One and Part Two run back to back, and the two are built to dovetail: Part One finishes in Morondava on the morning Part Two flies south from the capital. Same group, same tour leader, one continuous run.

  Part One takes you from Tana west through the highlands, down the Tsiribihina by canoe, over the jagged rocks of the Tsingy and out to the Avenue of the Baobabs. Part Two picks up on the south-west coast at Ifaty and works back north through the canyons, the climbing at Tsaranoa and the Ranomofana rainforest, finishing back in the capital.

  Nineteen days rather than twenty, because the changeover day belongs to both halves.

windows_text: Each Part One departure runs straight into a Part Two departure. Pick a window and you are booked on both; pick a single row above or below and you are doing half the island.
itinerary_text: "The full nineteen days are the two itineraries in sequence. They live on their own pages so each stays readable:"

included:
  - Tour leader with you for the whole trip
  - Airport pick-up to the group hotel
  - Local tour, national park & climbing guides
  - Trip photographer
  - Eco lodges & hotels, local-owned and locally run
  - "All activities: canoeing, camping, hiking and the rest"
  - Drivers, transport & fuel
  - National park permits & entrance fees
  - Internal flights
  - All breakfasts & most dinners

not_included:
  - International flights
  - Travel insurance (required)
  - Lunches
  - Your visa (online, or on arrival in the capital)
  - "Personal items: SIM card, laundry, alcohol"
  - Optional single room supplement

button_label: Ask about the Grand Tour
