itinerary:
  - title: Antananarivo to Ifaty
    text: The whole group will meet in Antananarivo, flying south to Tulear where our new drivers team will collect us and bring us to our beach-side abode in Ifaty. Enjoy a swim in the ocean or pool before we start evening activities that include local crafts, drinks & your first team dinner.
  - title: The Coast
    text: This morning you will have a chance to ride in a traditional Malagasy pirogue, and snorkel the crystal blue waters of the south west coast. We then journey by land from the sea to the canyon-riddled outback, settling in one of the most scenic parks in Madagascar.
  - title: Canyons
    text: Our group heads deep into the national park with a local expert guide, learning of the traditional tribal rituals, spotting King Julien and his cronies in the wild, and taking a dip in two oasis-style swim spots deep in the park before looping back on an immersive hike.
  - title: Canyons & Climbing
    text: Today you have the option to rock climb the cavernous canyon walls, or get harnessed up and come via ferrata on the outer canyon walls. This evening we drive into a famous mountain range, enticing Madagascar’s biggest adventurers yet.
  - title: Tsaranoa
    text: Our local experts will split us up to partake in activities of your choice today. We have a moderate hike, a difficult hike with ropes, and the opportunity to rock climb on the vertical face of a mountain. Today will challenge you, but we will be there to guide you through each activity.
  - title: Ranomofana
    text: "Heading through the mountainous valleys, we continue through Malagasy farmland, reaching one of Madagascar’s most pristine natural rainforests: Ranomofana. This afternoon we will hike to see as many lemur species as we can. This evening we also have a night walk to discover chameleons, reptiles, & the infamous mouse lemurs. (Mort!)"
  - title: Ranomofana
    text: We have a morning hike on a different side of the national park, continuing our search for numerous endemic species and enjoying the lush forest. This afternoon, we have the opportunity to discover a tree nursery and tree plant among Madagascar’s local heroes who live to preserve these valuable rainforests.
  - title: Antsirabe
    text: We set off from the rainforest canopies to the Malagasy farm and rural villages, stopping to have a much-loved soccer match with keen energetic kids. We land in Antsirabe, a fun-filled city of music and food, to enjoy a dance and evening out on the town with Malagasy beats.
  - title: Antananarivo
    text: With a few more stops along the way, the group finishes by early afternoon back in “Tana.” There will be time to check out the local parliament buildings and city square, and have our farewell family meal.
  - title: Departure Day, or Wait in the Capital for Part One
    text: "For those finishing up in Madagascar, today is your departure day. For those heading out on **Experience Madagascar Part One: Lemurs, Baobabs & Canoeing the Wild Tsiribihina**, there is time to hang around in the capital in between."

