about:
  photo: /assets/img/amanda.jpg
  photo_alt: Amanda in a sun hat and hiking gear, striking a pose on a trip
  eyebrow: About
  heading: Hey there, I'm Amanda
  text: |-
    On a major cross-continent trip 10 years ago, I met my travel soulmates. Each year since the Mongol Rally in 2016, I have been organizing super adventurous trips for our friends & friends of friends. With our group forever expanding, and more bucket list destinations to tick off, we decided to put together a lil company and invite others along to have the time of their lives.

    We run 4–6 departures a year, led by a fantastic tour leader that organizes everything for you. Without worries, you get to sit back, relax, get involved in all group activities, & enjoy all the sights. Each day is an adventure with like-minded explorers who are keen for daily adventure.

    Our group members are mostly well-travelled, but do not have the time to worry about logistics.

reviews:
  eyebrow: Kind words
  heading: From people who came along
  quotes:
    - quote: I booked on my own and spent the first evening quietly panicking about it. By day three I forgot what I was ever worried about. Loved the group dynamic, we still talk every day.
      by: Rachel B. — Patagonia, 2025
    - quote: Amanda had a plan B for the weather, and then a plan C. We used both and it was still the best week of my year.
      by: Marcus & Jo — Egypt, 2026
    - quote: Fourteen strangers on day one. There's still a group chat and someone's organising a reunion. Can't wait for another trip!
      by: Priya R. — Madagascar, 2025

newsletter:
  eyebrow: First refusal
  heading: Trips go to the list first
  text: New departures go out by email a fortnight before they're announced here. That's usually when the good spots go.
