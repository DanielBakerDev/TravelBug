notes:
  - "Also on the list: the Winter Olympics in Italy, Trinidad & Tobago, Kazakhstan, Mongolia, and Paraguay & Uruguay."
  - Want one of these to run again? [Tell us which](contact.html) — enough interest and it goes back on the calendar.

newsletter:
