seo:
  title: Past journeys — Travel Bug Tours
  description: Trips Travel Bug Tours has already run — Antarctica, Patagonia, Egypt, Uganda, Rwanda, Burundi, Uzbekistan, Guyana and more.

hero:
  image: /assets/img/past-antarctica.jpg
  eyebrow: Been there
  title: Past journeys
  text: Trips that have already run. Several of these come back round every couple of years — say the word if one of them is calling.

